  query getLeaderGroupsWithDues {
    self {
      id
      stripeConnectAccount {
        status
      }
      memberships(filter: { status: LEADER, leaderSubset: PRIMARY }) {
        edges {
          node {
            id
            name
            urlname
            country
            duesSettings {
              amount
              paymentType
              currency
              interval
            }
          }
        }
      }
    }
  }
