  mutation updateNetworkTies(
    $status: ProNetworkTieStatus!
    $groupsFilter: NetworkGroupsFilter!
    $networkId: ID!
  ) {
    updateProNetworkTieStatus(
      input: { status: $status, groupsFilter: $groupsFilter, networkId: $networkId }
    ) {
      errors {
        code
        message
      }
      success
    }
  }
