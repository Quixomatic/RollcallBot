  fragment BuildMeetupGroupSearch on Group {
    id
    name
    link
    description
    link
    city
    state
    status
    country
    isPrivate
    isNewGroup
    groupPhoto {
      id
      baseUrl
    }
    stats {
      memberCounts {
        all
      }
      eventRatings {
        average
        totalRatings
      }
    }
    sampleMembers: memberships(first: 10, filter: { status: [ACTIVE, LEADER] }) {
      edges {
        node {
          id
          name
          memberPhoto {
            id
            baseUrl
          }
        }
      }
    }
  }
