  query getStepUpGroups {
    self {
      id
      stepUpGroups: memberships(
        filter: { status: [ACTIVE, LEADER], groupStatus: [FROZEN] }
        sort: { sortOrder: DESC, sortField: EVENT_DATE }
        first: 20
      ) {
        pageInfo {
          hasNextPage
          startCursor
          endCursor
        }
        edges {
          node {
            id
            name
            urlname
            frozenStart
          }
        }
      }
    }
  }
