  query proGroups(
    $networkId: ID!
    $first: Int
    $after: String
    $query: String
    $lat: Float
    $lon: Float
    $radius: Float
    $country: String
    $memberCountMin: Int
    $memberCountMax: Int
    $pastEventsMin: Int
    $pastEventsMax: Int
    $upcomingEventsMin: Int
    $upcomingEventsMax: Int
    $inactiveWithinDays: Int
    $nextEventMin: DateTime
    $nextEventMax: DateTime
    $foundedDateMin: DateTime
    $foundedDateMax: DateTime
    $sort: String
    $desc: Boolean
  ) {
    proNetwork(id: $networkId) {
      id
      groupsSearch(
        input: {
          first: $first
          after: $after
          sort: $sort
          desc: $desc
          filter: {
            query: $query
            latitude: $lat
            longitude: $lon
            country: $country
            radius: $radius
            memberCountMin: $memberCountMin
            memberCountMax: $memberCountMax
            pastEventsMax: $pastEventsMax
            pastEventsMin: $pastEventsMin
            upcomingEventsMax: $upcomingEventsMax
            upcomingEventsMin: $upcomingEventsMin
            inactiveWithinDays: $inactiveWithinDays
            nextEventMax: $nextEventMax
            nextEventMin: $nextEventMin
            foundedDateMin: $foundedDateMin
            foundedDateMax: $foundedDateMax
          }
        }
      ) {
        totalCount
        pageInfo {
          hasNextPage
          endCursor
        }
        edges {
          cursor
          metadata {
            averageRsvpsPerEvent
            lastEventDate
            nextEventDate
            totalPastEvents
            totalUpcomingEvents
            tieStatus
          }
          node {
            id
            name
            urlname
            city
            state
            country
            isPrimaryOrganizer
            foundedDate
            status
            proRsvpSurveySettings {
              rsvpSurveyEnabledByDefault
            }
            membershipMetadata {
              role
            }
            memberships {
              totalCount
            }
            orgs: memberships(filter: { status: LEADER }) {
              totalCount
            }
          }
        }
      }
    }
  }
